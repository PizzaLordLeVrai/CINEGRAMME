<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinégram</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0f;--p:#121217;--p2:#18181e;--l:#292930;--m:#91919d;--t:#f5f3f5;--a:#e8326a;--a2:#ff6a8d;--pmr:#3b8bbe;--f:"Space Grotesk",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
html{scroll-padding-top:env(safe-area-inset-top,0)}
body{background:var(--bg);color:var(--t);font-family:Inter,sans-serif;font-size:14px;min-width:320px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit}
h1,h2,h3,h4,.f{font-family:var(--f)}
small{color:var(--m)}
.side{position:fixed;inset:0 auto 0 0;width:220px;border-right:1px solid var(--l);padding:28px 16px 18px;display:flex;flex-direction:column;background:#0b0b0fF2;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font:700 17px var(--f);letter-spacing:.08em;padding:0 8px}
.bm{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#ff275f,#a321df);display:grid;place-items:center;font-size:12px}
.nav{display:grid;gap:6px;margin-top:40px}
.ni{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:#a7a6af;font-weight:600;transition:.2s}
.ni:hover{background:#16161c;color:#fff;transform:translateX(4px)}
.ni.on{background:#e8326a1c;color:#ff547d}
.cnt{margin-left:auto;background:var(--a);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:11px}
.prem{margin-top:auto;border:1px solid #343039;border-radius:16px;background:linear-gradient(145deg,#21151c,#17141b);padding:16px}
.prem p{color:#ff6d8f;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.prem strong{display:block;margin-top:8px;font:600 15px var(--f)}
.prem small{font-size:11px}
.prem button{width:100%;margin-top:12px;background:var(--a);border-radius:9px;padding:9px;text-align:center;font-weight:700;font-size:12px}
main{margin-left:220px;min-height:100vh}
.top{position:sticky;top:0;z-index:20;height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 36px;border-bottom:1px solid var(--l);background:#0b0b0fE0;backdrop-filter:blur(14px)}
.sb{display:flex;align-items:center;gap:10px;width:min(500px,55vw);background:#15151a;border:1px solid var(--l);border-radius:12px;padding:11px 14px;color:#777780;font-size:13px}
.ib{width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;font-size:17px}
.ib:hover{background:var(--p2)}
.wrap{width:min(1120px,calc(100% - 56px));margin:0 auto;padding:30px 0 80px;animation:in .4s both}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.eb{color:var(--a);font-size:10px;font-weight:700;letter-spacing:.17em;margin-bottom:6px}
h1{font-size:27px;font-weight:700}
.hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;gap:10px}
.hd span{color:var(--m);font-size:12px;display:block;margin-top:4px}
.pill{border:1px solid #36363f;border-radius:10px;background:var(--p);padding:9px 13px;font-size:12px;font-weight:600;white-space:nowrap}
.stories{display:flex;gap:18px;overflow-x:auto;margin:18px 0 6px;padding-bottom:8px}
.story{display:grid;justify-items:center;gap:6px;font-size:11px;color:#aaa9b2;flex:0 0 66px}
.ring{width:62px;height:62px;border-radius:50%;padding:3px;background:conic-gradient(var(--a),#ad42e9,#ff9d50,var(--a))}
.ring i,.av{display:grid;place-items:center;border-radius:50%;font-style:normal;font-weight:700;font-family:var(--f);background:#222}
.ring i{width:100%;height:100%;border:3px solid var(--bg);font-size:13px}
.av{width:36px;height:36px;font-size:12px}
.lay{display:grid;grid-template-columns:minmax(0,660px) 300px;gap:30px;justify-content:center;margin-top:20px}
.feed{display:grid;gap:22px}
.card{border:1px solid var(--l);border-radius:17px;background:var(--p);overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
.ph>span{display:flex;gap:10px;align-items:center}
.ph strong{font-size:13px;display:block}.ph small{font-size:10px}
.vis{position:relative;display:block;width:100%;height:420px;overflow:hidden}
.vis .sh{position:absolute;inset:0;background:linear-gradient(to top,#08070ae0,transparent 55%)}
.vis .pc{position:absolute;left:30px;bottom:30px;right:30px}
.pc small{font-size:9px;letter-spacing:.2em;font-weight:700;color:#ffffffb0}
.pc strong{display:block;font:700 clamp(30px,5vw,50px)/.98 var(--f);letter-spacing:-.04em;margin:6px 0}
.pc em{font-family:Georgia,serif;color:#ffffffd0}
.badge{position:absolute;top:16px;right:16px;background:#0a0a0d99;border-radius:7px;padding:6px 9px;color:#ffcc59;font-size:12px;font-weight:700}
.bl{position:absolute;top:16px;left:16px;background:#e8326ae6;border-radius:7px;padding:6px 9px;font-size:9px;font-weight:700;letter-spacing:.12em}
.act{display:flex;justify-content:space-between;padding:14px 18px 6px;font-size:22px}
.act button{margin-right:14px;transition:.15s}.act button:hover{transform:scale(1.12)}
.act .lk{color:var(--a)}.act .sv{color:#ffca5b}
.body{padding:0 18px 14px;font-size:13px;line-height:1.55;color:#d4d2d7}
.body strong{display:block;color:#fff;font-size:12px;margin-bottom:5px}
.tags{color:#809ec2;font-size:11px;margin-top:6px}
.show{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;padding:13px 17px;background:#15151a;border-top:1px solid var(--l)}
.sd{width:42px;height:48px;border:1px solid #36363e;border-radius:9px;display:grid;place-items:center;align-content:center;font-size:9px;font-weight:700}
.sd b{color:var(--a2);font-size:13px}
.show small{font-size:8px;font-weight:700;letter-spacing:.1em;color:var(--a2);display:block}
.show strong{font-size:13px}
.btn{background:var(--a);border-radius:10px;padding:11px 16px;font-weight:700;font-size:13px;text-align:center;transition:.15s}
.btn:hover{background:#ff4676}.btn:disabled{opacity:.4}
.btn.w{width:100%;margin-top:22px}
.side2{position:sticky;top:90px;align-self:start}
.side2 h2{font-size:14px;margin:0 0 12px}
.cc{border:1px solid var(--l);border-radius:14px;background:var(--p);padding:14px;margin-bottom:24px}
.cc strong{display:block}.cc small{font-size:11px}
.mt{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.mt button,.tm{border:1px solid #404049;border-radius:7px;padding:6px 10px;font-size:11px;font-weight:700;transition:.15s}
.mt button:hover,.tm:hover{border-color:var(--a);color:var(--a2);background:#e8326a1f}
.tr{display:grid;grid-template-columns:22px 44px 1fr;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid #202027;width:100%}
.tr i{width:44px;height:52px;border-radius:7px}.tr b{color:#565661;font-family:var(--f)}.tr strong{font-size:12px;display:block}.tr small{font-size:10px}
.row{display:flex;align-items:center;gap:10px;margin-top:12px}.row>span{flex:1}.row strong{font-size:12px;display:block}.row small{font-size:10px}
.fl{color:var(--a2);font-size:12px;font-weight:700}.fl.on{color:var(--m)}
.cats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.cats button{border:1px solid #33333b;border-radius:99px;padding:10px 20px;color:#a5a3ad;font-size:13px;font-weight:600;white-space:nowrap;transition:.2s}
.cats .on,.cats button:hover{border-color:#e8326a80;background:#e8326a1f;color:#ff7796}
.feat{position:relative;display:block;width:100%;height:260px;border-radius:18px;overflow:hidden;background:linear-gradient(120deg,#ff4f79,#3a0f2a)}
.feat div{position:absolute;left:32px;top:50%;transform:translateY(-50%);max-width:440px}
.feat small{color:#fff;font-size:10px;font-weight:700;letter-spacing:.13em}
.feat strong{display:block;font:700 clamp(22px,4vw,34px)/1.1 var(--f);margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:150px;grid-auto-flow:dense;gap:4px;margin-top:14px}
.grid button{position:relative;border-radius:4px;overflow:hidden;display:flex;align-items:flex-end;padding:10px;font-size:11px;font-weight:700;transition:.3s}
.grid button:hover{filter:brightness(1.2);transform:scale(.99)}
.grid .tall{grid-row:span 2}.grid .wide{grid-column:span 2}
.cg{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.cg .card:first-child{grid-row:span 2}
.cv{position:relative;height:170px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;background-size:cover}
.cv small{color:#ff7897;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.cv h2{font-size:20px}.cv p{font-size:11px;color:#b7b5bc}
.dist{position:absolute;top:14px;right:14px;background:#08080b99;border-radius:99px;padding:6px 10px;font-size:10px;font-weight:700}
.mine{position:absolute;top:14px;left:14px;background:var(--a);border-radius:6px;padding:5px 8px;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.prog{padding:14px 18px 18px}
.vm{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--l)}
.vm i{width:52px;height:68px;border-radius:8px}.vm strong{font-size:13px}.vm small{display:block;font-size:11px;margin-top:2px}
.soon{display:flex;align-items:center;gap:9px;margin-top:14px;border-radius:10px;background:#e8326a12;padding:10px 12px;color:#ff7897;font-size:11px}
.soon strong{color:#c9c7cd;font-weight:600;display:block;font-size:11px}
.rt{display:grid;grid-template-columns:170px 1fr 170px;min-height:230px;border:1px solid #303038;border-radius:18px;background:var(--p);overflow:hidden;margin-bottom:16px}
.rt>i{display:block}.ri{padding:24px}.ri p{color:var(--a2);font-size:10px;font-weight:700;text-transform:uppercase}
.ri h2{font-size:22px;margin:4px 0 18px}
.dt{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:12px}.dt small{font-size:10px;display:block}.dt strong{font-size:13px}
.ex{margin-top:14px;color:#ffb15f;font-size:11px}
.stub{border-left:1px dashed #3b3b43;display:grid;place-items:center;align-content:center;padding:18px;text-align:center;gap:8px}
.qr{width:92px;height:92px;border-radius:9px;background:#fff;display:grid;grid-template-columns:repeat(9,1fr);padding:7px;gap:1px}
.qr s{background:#111}.qr s.o{background:#fff}
.stub small{font-size:10px}.stub button{border:1px solid #3b3a43;border-radius:7px;padding:6px 9px;font-size:10px}
.empty{text-align:center;border:1px solid var(--l);border-radius:17px;background:var(--p);padding:60px 20px}
.empty h2{margin:12px 0 6px}
.prof{border:1px solid var(--l);border-radius:20px;background:var(--p);overflow:hidden}
.pcv{height:190px;background:linear-gradient(120deg,#e8326a,#3a1050,#0b0b0f)}
.pm{padding:0 32px 30px}
.pid{display:flex;align-items:flex-end;gap:16px;margin-top:-45px;flex-wrap:wrap}
.pid .av{width:104px;height:104px;font-size:32px;border:5px solid var(--p);background:linear-gradient(135deg,#ff275f,#a321df)}
.pid>div{flex:1}.pid h1{font-size:24px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);max-width:580px;margin-top:20px;border:1px solid #2f2f37;border-radius:13px;background:#15151a}
.stats button{text-align:center;padding:13px 6px;border-right:1px solid #2f2f37}.stats button:last-child{border:0}
.stats button.on,.stats button:hover{background:#e8326a17;color:#ff7897}
.stats strong{display:block;font:700 16px var(--f)}.stats small{font-size:10px}
.ins{margin-top:16px;border:1px solid #33333c;border-radius:14px;background:#15151a;overflow:hidden}
.ins>div{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #2d2d34}
.ins .it{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid #292930;align-items:center}
.ins .it i{width:50px;height:60px;border-radius:7px;flex:none}.ins .it span{flex:1}.ins .it strong{font-size:13px;display:block}.ins .it small{font-size:11px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);margin:24px -32px 0;border-top:1px solid var(--l)}
.tabs button{text-align:center;padding:14px;color:var(--m);font-size:12px;font-weight:700}
.tabs .on{color:#fff;box-shadow:inset 0 2px var(--a)}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:0 -32px -30px}
.pg button{aspect-ratio:1;display:grid;place-items:center;font-weight:700;font-size:13px}
.pg button:hover{filter:brightness(1.25)}
.mn{display:none}
.bd{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow-y:auto;background:#050507d1;padding:24px;backdrop-filter:blur(8px)}
.md{position:relative;width:min(700px,100%);max-height:calc(100vh - 48px);overflow-y:auto;border:1px solid #35343c;border-radius:22px;background:#111116;animation:in .25s both}
.x{position:absolute;top:14px;right:14px;z-index:3;width:38px;height:38px;border-radius:50%;background:#0a0a0da0;display:grid;place-items:center;font-size:18px;text-align:center}
.dh{position:relative;height:300px;display:flex;flex-direction:column;justify-content:flex-end;padding:30px}
.dh::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#111116 2%,transparent 75%)}
.dh>*{position:relative;z-index:1}.dh p{color:#ff7897;font-size:11px;font-weight:700;text-transform:uppercase}
.dh h2{font-size:34px;font-weight:700;margin:3px 0}.dh em{font-family:Georgia,serif;color:#d2d0d4}
.meta{display:flex;gap:8px;margin-top:12px}.meta span{border:1px solid #ffffff2e;border-radius:5px;padding:4px 8px;font-size:11px}
.dc{padding:6px 32px 30px}.dc>p{color:#aaa8b0;line-height:1.65}
.cast{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.cast .av{width:100%;height:auto;aspect-ratio:1;border-radius:10px;font-size:22px}
.cast strong{display:block;margin-top:6px;font-size:12px}.cast small{font-size:11px}
.bh{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--l);text-align:center}
.bh .b{width:36px;height:36px;border-radius:50%;background:var(--p2);display:grid;place-items:center}
.bh p{color:var(--a2);font-size:9px;font-weight:700;letter-spacing:.12em}.bh h2{font-size:16px}
.stp{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:12px 22px 0}.stp i{height:3px;border-radius:3px;background:#303037}.stp i.on{background:var(--a)}
.bc{padding:26px 32px 30px}.bc h3{font-size:20px}.bc .sub{color:var(--m);font-size:12px;margin-top:4px}
.dp,.tp{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:20px}
.dp button,.tp button{border:1px solid #34343c;border-radius:11px;padding:11px 6px;text-align:center}
.dp strong{display:block;font-size:20px}.dp small,.tp small{font-size:10px}.tp strong{font-size:14px;display:block}
.dp .on,.tp .on{border-color:var(--a);background:#e8326a1a}
.scr{height:6px;margin:18px 40px 22px;border-radius:50% 50% 0 0;border-top:3px solid #716777;box-shadow:0 8px 14px #e8326a33}
.sm{display:grid;gap:6px}.sr{display:grid;grid-template-columns:14px repeat(12,1fr) 14px;gap:4px;align-items:center}
.sr>span{font-size:10px;color:#66656e;text-align:center}
.sr button{aspect-ratio:1.1;border-radius:5px 5px 7px 7px;background:#393940;display:grid;place-items:center;font-size:9px;transition:.12s}
.sr button:hover:not(:disabled){background:#5d4a54}
.sr .on{background:var(--a)!important}.sr .pm2{border:1px solid #4f93bd;background:#3b8bbe24;color:#70bce9}
.sr .pm2.on{background:#2888bf!important;color:#fff;border-color:#7ed2ff}
.sr button:disabled{opacity:.18;cursor:not-allowed}
.lg{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:16px;font-size:11px;color:var(--m)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;background:#393940;margin-right:5px;vertical-align:-1px}
.sumb{display:flex;align-items:center;gap:16px;margin:22px -32px -30px;padding:15px 32px;background:#15151a;border-top:1px solid var(--l)}
.sumb>span{flex:1}.sumb strong{font-size:18px;display:block}.sumb small{font-size:11px}
.tg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:20px}
.tg article{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;border:1px solid #34343c;border-radius:12px;background:#15151a;padding:12px}
.tg article.on{border-color:#e8326aa6;background:#e8326a12}
.tg .ti{width:52px;height:52px;border-radius:11px;background:#2c2228;display:grid;place-items:center;font-size:26px;grid-row:span 2}
.tg strong{font-size:13px;display:block}.tg small{font-size:10px}.tg b{color:#ffb15f;font-size:12px;display:block;margin-top:3px}
.qp{grid-column:1/-1;display:flex;justify-content:flex-end;align-items:center;gap:10px}
.qp button{width:28px;height:28px;border:1px solid #42414a;border-radius:50%;text-align:center}
.qp button:disabled{opacity:.25}
.note{margin-top:14px;background:#ffb15f12;border-radius:10px;padding:10px 12px;color:#ffb15f;font-size:12px}
.ts{display:grid;grid-template-columns:90px 1fr;gap:16px;margin-top:18px;border:1px solid var(--l);border-radius:13px;background:var(--p2);padding:12px}
.ts i{height:115px;border-radius:9px}.ts p{color:#aaa8b0;font-size:12px;margin-top:6px}.ts h4{font-size:16px;margin:3px 0 8px}
.pl{display:grid;gap:9px;margin-top:18px}.pl span{display:flex;justify-content:space-between;color:#aaa8b0}
.pl .tot{border-top:1px solid var(--l);padding-top:11px;color:#fff;font-size:15px;font-weight:700}
.cf{margin-top:18px;display:grid;grid-template-columns:1fr 76px 64px;border:1px solid #383840;border-radius:10px;overflow:hidden}
.cf input{background:#17171c;border:0;border-right:1px solid #383840;padding:11px;font-size:12px;outline:0;min-width:0}
.ok{text-align:center;padding:50px 34px 40px;display:grid;justify-items:center}
.ok .ck{width:70px;height:70px;border-radius:50%;background:#44be741f;color:#55d58a;display:grid;place-items:center;font-size:32px;box-shadow:0 0 0 10px #44be740d}
.ok .tk{margin-top:22px;border:1px dashed #4a4a52;border-radius:13px;background:var(--p2);padding:16px 30px}
.tk strong{color:var(--a2);font-size:20px;display:block}
.so{position:fixed;inset:0;z-index:150;background:#08080bf0;padding:12vh 24px;backdrop-filter:blur(16px)}
.so>*{width:min(640px,100%);margin:0 auto;display:block}
.sd2{display:flex;align-items:center;gap:12px;border-bottom:1px solid #55545d;padding:10px 4px}
.sd2 input{flex:1;background:none;border:0;outline:0;font-size:19px}
#sres{margin-top:24px}#sres p{color:var(--m);font-size:10px;font-weight:700;letter-spacing:.15em}
#sres button{display:grid;grid-template-columns:46px 1fr;gap:13px;align-items:center;width:100%;padding:11px 0;border-bottom:1px solid #24242b}
#sres i{width:46px;height:46px;border-radius:8px}#sres strong{display:block;font-size:14px}#sres small{font-size:11px}
.cmt{display:flex;gap:14px;padding:17px 26px;border-bottom:1px solid var(--l)}.cmt .av{width:46px;height:46px;flex:none;font-size:14px}
.cmt>span{flex:1;font-size:15px;line-height:1.55}.cmt b{margin-right:6px}.cmt small{display:block;font-size:11px;margin-top:3px}
.cmt button{font-size:16px;text-align:center;min-width:32px;color:var(--m)}.cmt button.lk{color:var(--a)}.cmt button small{margin:0}
.cmi{display:flex;gap:12px;align-items:center;padding:16px 24px;border-top:1px solid var(--l)}
.cmi input{flex:1;min-width:0;background:#17171c;border:1px solid #383840;border-radius:99px;padding:13px 18px;font-size:14px;outline:0}
.cmi .btn{padding:10px 15px}
[data-a]{cursor:pointer}
